name: Qualidade do jogo
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: qualidade-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run validate
      - uses: actions/upload-artifact@v4
        if: matrix.node == '22'
        with:
          name: learning-valley-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
