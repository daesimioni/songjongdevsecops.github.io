<!doctype html>
<html lang="pt-BR">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Expansão de referências · Vale Partido</title
  ><style>
    :root {
      color-scheme: dark;
      font: 16px system-ui;
      background: #17232c;
      color: #d9e2d3;
    }
    body {
      margin: auto;
      max-width: 1200px;
      padding: 24px;
    }
    a {
      color: #9cddd2;
    }
    header {
      position: sticky;
      top: 0;
      background: #17232cf5;
      padding: 12px 0;
      z-index: 1;
    }
    button,
    select,
    input {
      font: inherit;
      padding: 8px;
      background: #293b43;
      color: inherit;
      border: 1px solid #8c9a85;
      border-radius: 4px;
    }
    label {
      display: inline-block;
      margin: 6px;
    }
    #cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
    }
    article {
      padding: 14px;
      background: #20313a;
      border: 1px solid #50666b;
      border-radius: 6px;
      min-width: 0;
    }
    h2 {
      font-size: 15px;
    }
    canvas {
      width: 100%;
      height: 220px;
      image-rendering: pixelated;
    }
    code {
      display: block;
      overflow-wrap: anywhere;
      font-size: 12px;
    }
    small {
      display: block;
      color: #b5c8bd;
    }
    #status {
      min-height: 1.4em;
    }
    button:focus-visible,
    select:focus-visible,
    input:focus-visible {
      outline: 3px solid #e2c383;
      outline-offset: 3px;
    }
  </style>
  <h1>Expansão de referências</h1>
  <p id="inventory">Carregando o catálogo…</p>
  <p>
    As peças de atlas são componentes para montagem, e não criaturas completas.
    <a href="sprite-library.html">Ver biblioteca modular</a> ·
    <a href="../docs/art/referencias/README.md">Método e cobertura</a>
  </p>
  <header>
    <label
      >Categoria
      <select id="category"></select></label
    ><button id="previous">Anterior</button
    ><label
      >Página
      <input
        id="page"
        type="number"
        min="1"
        value="1"
        style="width: 80px" /></label
    ><span id="pages"></span><button id="next">Próxima</button
    ><label><input type="checkbox" id="motion" /> Animar</label>
    <form id="search">
      <label
        >ID da arte
        <input id="id" placeholder="arte/categoria/chave" required /></label
      ><button>Abrir</button
      ><button type="button" id="reset">Voltar ao catálogo</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
  </header>
  <main id="cards"></main>
  <script type="module" src="reference-art.mjs"></script>
</html>
