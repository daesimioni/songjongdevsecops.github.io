<!doctype html>
<html lang="pt-BR">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Biblioteca modular — The Learning Valley</title
  ><style>
    :root {
      color-scheme: dark;
      font: 16px system-ui;
      background: #17232c;
      color: #e2e6d8;
    }
    body {
      margin: 0;
    }
    header {
      padding: 1.5rem;
      background: #23333e;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    h1 {
      font-size: 1.5rem;
      margin: 0 0 0.6rem;
    }
    p {
      max-width: 75ch;
    }
    label {
      display: inline-flex;
      gap: 0.4rem;
      align-items: center;
      margin: 0.3rem;
    }
    input,
    select,
    button {
      font: inherit;
      padding: 0.5rem;
      background: #17232c;
      color: inherit;
      border: 1px solid #8d9f9c;
      border-radius: 4px;
    }
    input[type="search"] {
      width: min(20rem, 80vw);
    }
    main {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 1rem;
      padding: 1rem;
    }
    article {
      background: #293944;
      padding: 1rem;
      border-radius: 6px;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 170px;
      image-rendering: pixelated;
      background: repeating-conic-gradient(#1e2c35 0% 25%, #24333c 0% 50%)
        0/16px 16px;
    }
    h2 {
      font-size: 1rem;
    }
    code {
      font-size: 0.7rem;
      overflow-wrap: anywhere;
    }
    small {
      display: block;
      margin: 0.5rem 0;
      color: #c0cdc6;
    }
    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 3px solid #e0bd70;
    }
    #status {
      margin: 0.5rem 0 0;
    }
  </style>
  <header>
    <h1>Biblioteca modular de sprites</h1>
    <p>
      Peças nativas do jogo, em pixels lógicos. O contorno verde mostra a
      colisão no chão; coberturas e decoração permitem passagem. O tamanho da
      prévia é ampliado para inspeção.
    </p>
    <label
      >Buscar
      <input
        id="query"
        type="search"
        placeholder="Ex.: porta, árvore, laboratório" /></label
    ><label
      >Categoria
      <select id="category">
        <option value="">Todas</option>
      </select></label
    ><label><input id="motion" type="checkbox" /> Animar</label
    ><label><input id="collision" type="checkbox" /> Colisões e alcance</label>
    <p id="status" role="status"></p>
  </header>
  <main id="cards"></main>
  <script type="module" src="./sprite-library.mjs"></script>
</html>
